# Ruff linter and formatter configuration for Self-Healing SQL Agent
target-version = "py311"
line-length = 100
src = ["app", "scripts", "tests"]
extend-exclude = [".venv", "build", "dist", "__pycache__"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by formatter
    "B008",  # allow FastAPI Depends(...) in argument defaults
]

[lint.per-file-ignores]
"scripts/**/*.py" = [
    "RUF001", # allow intentional Unicode UI glyphs in terminal scripts
]
"tests/**/*.py" = [
    "RUF012", # allow mutable class defaults on test/fake models
]

[lint.isort]
known-first-party = ["app", "scripts", "tests"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
